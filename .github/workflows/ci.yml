name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 13 * * *'   # daily dependency audit (see audit job)
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can diff the push range

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  typecheck:
    name: Type Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Install dependencies
        working-directory: 'Clientory App'
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: 'Clientory App'
        run: pnpm run typecheck

      - name: Build marketing site
        working-directory: 'Clientory App/artifacts/clientory'
        run: PORT=3000 BASE_PATH=/ pnpm run build

  # New advisories get published against unchanged code, so the audit does not
  # run on ordinary pushes (e.g. blog posts). It runs daily, on demand, and on
  # pull requests — which is where Dependabot's fix PRs arrive.
  audit:
    name: Dependency Audit
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Audit dependencies
        working-directory: 'Clientory App'
        run: pnpm audit --audit-level=critical
